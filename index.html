<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตลาดกลางสินค้ามือสองคณะ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { --green: #2e9e6b; --green-dark: #1f7a51; --blue: #1e5fa8; --gray-bg: #f1f4f6; --ink: #1d2a33; --line: #dde4e9; }
    body { font-family: 'Noto Sans Thai', sans-serif; background: var(--gray-bg); color: var(--ink); }
    .app-nav { background: linear-gradient(90deg, var(--green), var(--blue)); }
    .product-card { border: 1px solid var(--line); border-radius: 12px; transition: transform 0.2s; overflow: hidden; background: #fff; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    .thumb { height: 180px; object-fit: cover; width: 100%; background: #e9ecef; }
    .badge-status { font-size: 0.75rem; padding: 0.35em 0.65em; border-radius: 999px; }
    .st-ready { background: #dff3e8; color: #1f7a51; }
    .st-reserved { background: #fff1d6; color: #8a5a00; }
    .st-sold { background: #dfe4e8; color: #3d4b55; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark app-nav sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-store me-2"></i>ตลาดมือสองคณะ</a>
      <div class="d-flex gap-2 align-items-center">
        <button class="btn btn-sm btn-light fw-bold text-success" data-bs-toggle="modal" data-bs-target="#modalAddProduct">
          <i class="fa-solid fa-plus me-1"></i> ลงขายสินค้า
        </button>
        <a href="Seller .html" class="btn btn-sm btn-outline-light">หน้าผู้ขาย</a>
        <a href="Admin.html" class="btn btn-sm btn-outline-light">ผู้ดูแลระบบ</a>
        
        <!-- ปุ่มเข้าสู่ระบบ / ออกจากระบบ -->
        <div id="authNav">
          <button class="btn btn-sm btn-warning fw-bold" data-bs-toggle="modal" data-bs-target="#modalLogin">
            <i class="fa-solid fa-right-to-bracket me-1"></i> เข้าสู่ระบบ
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero & Search -->
  <div class="bg-white border-bottom py-4 mb-4">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 text-center">
          <h4 class="fw-bold mb-3">ค้นหาสินค้ามือสองสภาพดีภายในคณะ</h4>
          <div class="input-group mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="พิมพ์ชื่อสินค้า หรือสถานที่นัดรับ...">
            <button class="btn btn-success" onclick="applyFilters()"><i class="fa-solid fa-magnifying-glass"></i> ค้นหา</button>
          </div>
          <div class="d-flex gap-2 justify-content-center flex-wrap" id="catGroup">
            <button class="btn btn-sm btn-outline-secondary active" onclick="filterCat('', this)">ทั้งหมด</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="filterCat('หนังสือ/ตำรา', this)">หนังสือ/ตำรา</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="filterCat('อุปกรณ์การเรียน', this)">อุปกรณ์การเรียน</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="filterCat('เครื่องใช้ไฟฟ้า', this)">เครื่องใช้ไฟฟ้า</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="filterCat('เสื้อผ้า/เครื่องแต่งกาย', this)">เสื้อผ้า/เครื่องแต่งกาย</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Product Grid -->
  <main class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0">รายการสินค้า</h5>
      <span class="text-muted small" id="cntLabel">กำลังโหลด...</span>
    </div>
    <div class="row g-3" id="grid"></div>
  </main>

  <!-- Modal เข้าสู่ระบบ (Login) -->
  <div class="modal fade" id="modalLogin" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">เข้าสู่ระบบ</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formLogin">
            <div class="mb-3">
              <label class="form-label small fw-bold">รหัสประจำตัว 3 ตัวหลัง (เช่น 001)</label>
              <div class="input-group">
                <span class="input-group-text bg-light">169204140</span>
                <input type="text" id="loginCode" class="form-control" maxlength="3" required placeholder="001">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">รหัสผ่าน</label>
              <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-success w-100">เข้าสู่ระบบ</button>
          </form>
          <hr>
          <div class="text-center">
            <small class="text-muted">ยังไม่มีบัญชี?</small>
            <button class="btn btn-link btn-sm p-0 text-decoration-none" data-bs-toggle="modal" data-bs-target="#modalRegister">สมัครสมาชิก</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal สมัครสมาชิก (Register) -->
  <div class="modal fade" id="modalRegister" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">สมัครสมาชิกใหม่</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formRegister">
            <div class="mb-2">
              <label class="form-label small fw-bold">รหัสประจำตัว 3 ตัวหลัง</label>
              <div class="input-group">
                <span class="input-group-text bg-light">169204140</span>
                <input type="text" id="regCode" class="form-control" maxlength="3" required placeholder="001">
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label small fw-bold">ชื่อ-นามสกุล / ชื่อเล่น</label>
              <input type="text" id="regName" class="form-control" required placeholder="เช่น สมชาย ใจดี">
            </div>
            <div class="mb-2">
              <label class="form-label small fw-bold">ช่องทางติดต่อ (Line ID / เบอร์โทร)</label>
              <input type="text" id="regContact" class="form-control" required placeholder="Line: somchai_123">
            </div>
            <div class="mb-2">
              <label class="form-label small fw-bold">กำหนดรหัสผ่าน</label>
              <input type="password" id="regPassword" class="form-control" required placeholder="อย่างน้อย 6 ตัวอักษร">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">ประเภทบัญชี</label>
              <select id="regRole" class="form-select">
                <option value="user">นิสิตทั่วไป (User)</option>
                <option value="admin">ผู้ดูแลระบบ (Admin)</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">ยืนยันสมัครสมาชิก</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal ลงขายสินค้า -->
  <div class="modal fade" id="modalAddProduct" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">ลงประกาศขายสินค้า</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formAdd">
            <div class="mb-2">
              <label class="form-label small fw-bold">ชื่อสินค้า</label>
              <input type="text" id="pName" class="form-control" required placeholder="เช่น หนังสือ Calculus II สภาพ 95%">
            </div>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small fw-bold">ราคา (บาท)</label>
                <input type="number" id="pPrice" class="form-control" required placeholder="180">
              </div>
              <div class="col-6">
                <label class="form-label small fw-bold">หมวดหมู่</label>
                <select id="pCategory" class="form-select">
                  <option value="หนังสือ/ตำรา">หนังสือ/ตำรา</option>
                  <option value="อุปกรณ์การเรียน">อุปกรณ์การเรียน</option>
                  <option value="เครื่องใช้ไฟฟ้า">เครื่องใช้ไฟฟ้า</option>
                  <option value="เสื้อผ้า/เครื่องแต่งกาย">เสื้อผ้า/เครื่องแต่งกาย</option>
                </select>
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label small fw-bold">ช่องทางติดต่อ / สถานที่นัดรับ</label>
              <input type="text" id="pLocation" class="form-control" placeholder="เช่น Line: @somchai, ใต้ตึกวิศวะ">
            </div>
            <div class="mb-2">
              <label class="form-label small fw-bold">รูปภาพสินค้า</label>
              <input type="file" id="pFile" class="form-control" accept="image/*">
            </div>
            <button type="submit" class="btn btn-success w-100 mt-3">ลงประกาศขาย</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase & App Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>

  <script>
    let allProducts = [];
    let selectedCat = '';

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const baht = n => Number(n || 0).toLocaleString('th-TH') + ' บาท';

    // ดึงข้อมูล Realtime
    db.collection('products').onSnapshot(snap => {
      allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      applyFilters();
    });

    function filterCat(cat, btn) {
      selectedCat = cat;
      document.querySelectorAll('#catGroup .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      let list = allProducts.filter(p => (p.moderation || 'approved') === 'approved');

      if (selectedCat) list = list.filter(p => p.category === selectedCat);
      if (q) list = list.filter(p => (p.name || '').toLowerCase().includes(q) || (p.location || '').toLowerCase().includes(q));

      renderGrid(list);
    }

    function renderGrid(list) {
      const grid = document.getElementById('grid');
      document.getElementById('cntLabel').textContent = `พบ ${list.length} รายการ`;
      grid.innerHTML = '';

      if (!list.length) {
        grid.innerHTML = '<div class="col-12 text-center text-muted py-5">ไม่พบรายการสินค้า</div>';
        return;
      }

      list.forEach(p => {
        const isReady = p.status === 'Ready' || !p.status;
        const badgeCls = p.status === 'Ready' || !p.status ? 'st-ready' : p.status === 'Reserved' ? 'st-reserved' : 'st-sold';
        const badgeTxt = p.status === 'Ready' || !p.status ? 'พร้อมขาย' : p.status === 'Reserved' ? 'ติดจอง' : 'ขายแล้ว';

        grid.innerHTML += `
          <div class="col-6 col-md-4 col-lg-3">
            <div class="card product-card h-100">
              <img src="${esc(p.imageUrl || 'https://picsum.photos/400/300')}" class="thumb" alt="">
              <div class="card-body d-flex flex-column p-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <span class="badge bg-light text-dark border small">${esc(p.category || 'ทั่วไป')}</span>
                  <span class="badge-status ${badgeCls}">${badgeTxt}</span>
                </div>
                <h6 class="fw-bold text-truncate mb-1">${esc(p.name)}</h6>
                <div class="text-success fw-bold mb-1">${baht(p.price)}</div>
                <div class="text-muted small mb-2"><i class="fa-solid fa-location-dot me-1"></i>${esc(p.location || 'ติดต่อผู้ขาย')}</div>
                <div class="mt-auto pt-2 border-top d-flex justify-content-between align-items-center">
                  <span class="small text-muted"><i class="fa-solid fa-user me-1"></i>${esc(p.sellerName || p.sellerId || 'ผู้ขาย')}</span>
                  <button class="btn btn-sm ${isReady ? 'btn-outline-primary' : 'btn-light disabled'}" 
                          onclick="buyProduct('${p.id}', '${esc(p.name)}', '${esc(p.sellerId)}', ${p.price})">
                    ${isReady ? 'สั่งซื้อ' : 'ไม่พร้อมขาย'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    // สั่งซื้อสินค้า
    async function buyProduct(pid, pname, sellerId, price) {
      const user = firebase.auth().currentUser;
      if (!user) {
        alert("กรุณาเข้าสู่ระบบก่อนทำการสั่งซื้อสินค้า");
        new bootstrap.Modal(document.getElementById('modalLogin')).show();
        return;
      }

      try {
        const batch = db.batch();
        const orderRef = db.collection('orders').doc();

        batch.set(orderRef, {
          productId: pid,
          productName: pname,
          sellerId: sellerId || 'seller01',
          buyerId: user.uid,
          status: 'requested',
          total: price,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        batch.update(db.collection('products').doc(pid), {
          status: 'Reserved',
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await batch.commit();
        alert("ส่งคำขอสั่งซื้อเรียบร้อยแล้ว!");
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
      }
    }

    // Form Event Listeners
    document.getElementById('formLogin').addEventListener('submit', e => {
      e.preventDefault();
      loginUser(document.getElementById('loginCode').value, document.getElementById('loginPassword').value);
    });

    document.getElementById('formRegister').addEventListener('submit', e => {
      e.preventDefault();
      registerUser(
        document.getElementById('regCode').value,
        document.getElementById('regPassword').value,
        document.getElementById('regName').value,
        document.getElementById('regContact').value,
        document.getElementById('regRole').value
      );
    });

    document.getElementById('formAdd').addEventListener('submit', async e => {
      e.preventDefault();
      const fileInput = document.getElementById('pFile');
      const file = fileInput.files[0];

      createProductPost(
        document.getElementById('pName').value,
        document.getElementById('pPrice').value,
        document.getElementById('pCategory').value,
        document.getElementById('pLocation').value,
        file
      );

      bootstrap.Modal.getInstance(document.getElementById('modalAddProduct')).hide();
      document.getElementById('formAdd').reset();
    });

    // อัปเดต UI เมื่อสลับสถานะ Login
    firebase.auth().onAuthStateChanged(user => {
      const authNav = document.getElementById('authNav');
      if (user) {
        authNav.innerHTML = `<button class="btn btn-sm btn-outline-light" onclick="logoutUser()">ออกจากระบบ</button>`;
      } else {
        authNav.innerHTML = `<button class="btn btn-sm btn-warning fw-bold" data-bs-toggle="modal" data-bs-target="#modalLogin"><i class="fa-solid fa-right-to-bracket me-1"></i> เข้าสู่ระบบ</button>`;
      }
    });
  </script>
</body>
</html>
