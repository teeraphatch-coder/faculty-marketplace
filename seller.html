<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หน้าผู้ขาย | ตลาดสินค้ามือสองคณะ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --green: #2e9e6b; --green-dark: #1f7a51; --blue: #1e5fa8; --blue-dark: #164a85; --gray-bg: #f1f4f6; --ink: #1d2a33; --muted: #6b7b86; --line: #dde4e9; }
  body { font-family: 'Noto Sans Thai', system-ui, sans-serif; background: var(--gray-bg); color: var(--ink); }
  .app-nav { background: linear-gradient(90deg, var(--green), var(--blue)); }
  .app-nav .navbar-brand { font-weight: 700; color: #fff; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  .panel-head { padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
  .panel-head h2 { font-size: 1.1rem; font-weight: 700; margin: 0; }
  .stat { border-left: 4px solid var(--green); padding: .75rem 1rem; background: #fff; border-radius: 8px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat.blue { border-left-color: var(--blue); }
  .stat .n { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
  .stat .l { color: var(--muted); font-size: .85rem; }
  .btn-green { background: var(--green); border-color: var(--green); color: #fff; }
  .btn-green:hover, .btn-green:focus { background: var(--green-dark); border-color: var(--green-dark); color: #fff; }
  .badge-status { font-weight: 500; padding: .4em .7em; border-radius: 999px; }
  .st-ready { background: #dff3e8; color: #1f7a51; }
  .st-reserved { background: #fff1d6; color: #8a5a00; }
  .st-pending { background: #e0ecfa; color: #164a85; }
  .st-shipping { background: #d9f0f4; color: #0f6675; }
  .st-sold { background: #dfe4e8; color: #3d4b55; }
  .st-cancelled { background: #fbe1e1; color: #a12a2a; }
  .product-row { display: flex; gap: .9rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); }
  .product-row:last-child { border-bottom: 0; }
  .thumb { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; background: var(--gray-bg); flex-shrink: 0; }
  .product-body { flex: 1; min-width: 0; }
  .product-name { font-weight: 700; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
  .empty { padding: 2rem 1rem; text-align: center; color: var(--muted); }
  img.thumb { cursor: zoom-in; }
</style>
</head>
<body>

  <div class="container d-flex justify-content-between">
    <a class="navbar-brand" href="index.html">ตลาดมือสองคณะ · ผู้ขาย</a>
    <div class="d-flex gap-2">
      <span id="whoami" class="text-white small align-self-center"></span>

<main class="container py-4">
  <div id="alertBox"></div>

  <div class="row g-2 mb-4">
    <div class="col-6 col-md-3"><div class="stat"><div class="n" id="cntProducts">0</div><div class="l">สินค้าทั้งหมด</div></div></div>
    <div class="col-6 col-md-3"><div class="stat"><div class="n" id="cntReady">0</div><div class="l">พร้อมขาย</div></div></div>
    <div class="col-6 col-md-3"><div class="stat blue"><div class="n" id="cntRequests">0</div><div class="l">คำขอรอยืนยัน</div></div></div>
    <div class="col-6 col-md-3"><div class="stat blue"><div class="n" id="cntSold">0</div><div class="l">ขายแล้ว</div></div></div>
  </div>

  <div class="row g-4">
    <section class="col-12 col-lg-7">
      <div class="panel">
        <div class="panel-head"><h2>สินค้าของฉัน</h2></div>
        <div id="productList"><div class="empty">กำลังโหลดสินค้าของคุณ...</div></div>
      </div>
    </section>

    <section class="col-12 col-lg-5">
      <div class="panel">
        <div class="panel-head"><h2>คำขอซื้อ/จองจากผู้ซื้อ</h2></div>
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="table-light">
              <tr><th>สินค้า</th><th>ผู้ซื้อ</th><th>สถานะ</th><th class="text-end">จัดการ</th></tr>
            </thead>
            <tbody id="orderBody"><tr><td colspan="4" class="empty">ยังไม่มีข้อมูล</td></tr></tbody>

</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3">

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
// js/firebase-config.js  — โหลดก่อน js/app.js ในทุกหน้า

const auth = firebase.auth();
const db = firebase.firestore();

<script>
// ==========================================================
// js/app.js — ตัวกลางของระบบ (ล็อกอิน/สมัคร/สิทธิ์/อัปโหลดรูป)
// (ฝังอยู่ในทุกหน้าต่อจากส่วน config)
// หน้าอื่นรอผู้ใช้พร้อมด้วย:  authReady.then(({ user, profile }) => { ... })
// ==========================================================
const IMGBB_API_KEY = '51a07553119e1552ace83af8297da074';
const AUTO_APPROVE = true;         // true = ประกาศใหม่แสดงทันที | false = รอแอดมินอนุมัติก่อน

const CURRENT_PAGE = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
const IS_AUTH_PAGE = CURRENT_PAGE.startsWith('auth');
const IS_ADMIN_PAGE = CURRENT_PAGE.startsWith('admin');

// ซ่อนหน้าไว้จนกว่าจะยืนยันตัวตนเสร็จ (กันเนื้อหาวาบก่อนเด้งไปหน้าล็อกอิน)
if (!IS_AUTH_PAGE) document.documentElement.style.visibility = 'hidden';
const showPage = () => { document.documentElement.style.visibility = ''; };

let currentUser = null, currentProfile = null;
let authBusy = false;              // กัน redirect อัตโนมัติระหว่างกำลังล็อกอิน/สมัคร
let _resolveAuth;
const authReady = new Promise(r => { _resolveAuth = r; });

// ---------- อัปโหลดรูปขึ้น ImgBB ----------
async function uploadImageToImgBB(imageFile) {
  if (!imageFile) return '';
  if (imageFile.size > 5 * 1024 * 1024) throw new Error('รูปต้องมีขนาดไม่เกิน 5 MB');
  const formData = new FormData();
  formData.append('image', imageFile);
  let res, data;
  try {
    res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
    data = await res.json();
  } catch (e) {
    throw new Error('เชื่อมต่อ ImgBB ไม่ได้ (เครือข่ายหรือส่วนขยายบล็อกโฆษณาอาจบล็อกอยู่)');
  }
  if (!data.success) throw new Error('ImgBB แจ้งว่า: ' + ((data.error && data.error.message) || ('HTTP ' + res.status)));
  return data.data.url;
}

// ---------- ข้อความ error ภาษาไทย ----------
function authErrorText(e) {
  const m = {
    'auth/operation-not-allowed': 'ยังไม่ได้เปิดวิธีล็อกอินนี้ใน Firebase Console (Authentication > Sign-in method)',
    'auth/unauthorized-domain': 'โดเมนนี้ยังไม่ได้อนุญาต: เพิ่มใน Authentication > Settings > Authorized domains (และห้ามเปิดแบบ file://)',
    'auth/email-already-in-use': 'อีเมล/รหัสนี้ถูกใช้สมัครแล้ว',
    'auth/weak-password': 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร',
    'auth/invalid-email': 'รูปแบบอีเมลหรือรหัสไม่ถูกต้อง',
    'auth/invalid-credential': 'อีเมล/รหัส หรือรหัสผ่านไม่ถูกต้อง',
    'auth/user-not-found': 'อีเมล/รหัส หรือรหัสผ่านไม่ถูกต้อง',
    'auth/wrong-password': 'อีเมล/รหัส หรือรหัสผ่านไม่ถูกต้อง',
    'auth/invalid-api-key': 'API Key ในส่วน firebaseConfig ไม่ถูกต้อง',
    'auth/popup-closed-by-user': 'ปิดหน้าต่างล็อกอินก่อนเสร็จสิ้น',
    'auth/too-many-requests': 'ลองผิดหลายครั้งเกินไป กรุณารอสักครู่',
    'permission-denied': 'ไม่มีสิทธิ์เข้าถึงฐานข้อมูล ตรวจสอบ Firestore Rules'
  };
  const raw = String((e && (e.code || e.message)) || e);
  if (raw.includes('api-key-not-valid') || raw.includes('invalid-api-key'))
    return 'API Key ใน firebaseConfig ไม่ถูกต้อง/ถูกลบไปแล้ว — คัดลอก config ใหม่จาก Firebase Console > Project settings > Your apps (Web app) มาวางแทนส่วน firebaseConfig ในไฟล์ HTML ทุกหน้า';
  return m[e && e.code] || (e && e.message) || String(e);
}

// ---------- โปรไฟล์ผู้ใช้ใน Firestore: users/{uid} (role = 'user' | 'admin') ----------
async function ensureProfile(user, extra = {}) {
  const ref = db.collection('users').doc(user.uid);
  const snap = await ref.get();
  const now = firebase.firestore.FieldValue.serverTimestamp();
  if (snap.exists) {                         // ไม่แตะ role เดิม อัปเดตแค่เวลาล็อกอิน
    await ref.update({ lastLogin: now });
    return snap.data();
  }
  const profile = {
    uid: user.uid,
    displayName: extra.displayName || user.displayName || (user.email || '').split('@')[0],
    email: user.email || '',
    photoURL: user.photoURL || '',
    role: 'user',                            // แอดมินตั้งผ่าน Firebase Console เท่านั้น
    nameSet: false,                          // ยังไม่ได้ตั้งชื่อ → จะถูกถามตอนเข้าระบบครั้งแรก
    createdAt: now,
    lastLogin: now
  };
  if (extra.year) profile.year = extra.year;
  if (extra.studentId) profile.studentId = extra.studentId;
  await ref.set(profile);
  return profile;
}

const goByRole = (p) => location.replace(p && p.role === 'admin' ? 'admin.html' : 'index.html');

// ---------- ล็อกอิน / สมัคร / Google / ออกจากระบบ (throw error ให้หน้าเรียกแสดงเอง) ----------
async function googleLogin() {
  authBusy = true;
  try {
    const r = await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    goByRole(await ensureProfile(r.user));
  } catch (e) { authBusy = false; throw e; }
}

function logoutUser() {
  const go = () => location.replace('auth.html');
  auth.signOut().then(go, go);
}

// ---------- หน้าต่างตั้งชื่อ (บังคับครั้งแรก / แก้ไขภายหลังได้ด้วย changeName ในหน้า index) ----------
function askProfileName(user, profile, required) {
  return new Promise((resolve) => {
    showPage();
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.65);display:flex;align-items:center;justify-content:center;padding:16px;font-family:"Segoe UI",Tahoma,sans-serif';
    const inp = 'width:100%;box-sizing:border-box;padding:11px;margin:6px 0 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;background:#fff;color:#0f172a';
    wrap.innerHTML = `
      <form style="background:#fff;color:#0f172a;border-radius:16px;padding:26px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3)">
        <h3 style="margin:0 0 6px;font-size:20px">👋 ตั้งชื่อของคุณ</h3>
        <p style="margin:0 0 16px;color:#64748b;font-size:14px">ชื่อนี้จะแสดงให้ผู้ซื้อ/ผู้ขายเห็น</p>
        <label style="font-size:14px;font-weight:600">ชื่อที่ใช้แสดง</label>
        <input id="pf-name" maxlength="40" required style="${inp}">
        <label style="font-size:14px;font-weight:600">ชั้นปี</label>
        <select id="pf-year" style="${inp}"><option value="1">ปี 1</option><option value="2">ปี 2</option><option value="3">ปี 3</option><option value="4">ปี 4</option></select>
        <div id="pf-err" style="color:#dc2626;font-size:13px;min-height:18px"></div>
        <div style="display:flex;gap:8px;margin-top:6px">
          ${required ? '' : '<button type="button" id="pf-cancel" style="flex:1;padding:12px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;cursor:pointer;font-weight:600">ยกเลิก</button>'}
          <button type="submit" id="pf-save" style="flex:2;padding:12px;border:0;background:#4f46e5;color:#fff;border-radius:10px;cursor:pointer;font-weight:700">บันทึก</button>
        </div>
      </form>`;
    document.body.appendChild(wrap);
    const q = (id) => wrap.querySelector(id);
    q('#pf-name').value = profile.displayName || user.displayName || '';
    q('#pf-year').value = String(profile.year || 1);
    q('#pf-name').focus();
    const cancel = q('#pf-cancel');
    if (cancel) cancel.onclick = () => { wrap.remove(); resolve(null); };

    q('form').onsubmit = async (e) => {
      e.preventDefault();
      const name = q('#pf-name').value.trim();
      if (name.length < 2) { q('#pf-err').textContent = 'กรุณาใส่ชื่ออย่างน้อย 2 ตัวอักษร'; return; }
      q('#pf-save').disabled = true;
      try {
        const patch = { displayName: name, year: parseInt(q('#pf-year').value, 10), nameSet: true };
        await db.collection('users').doc(user.uid).update(patch);
        user.updateProfile({ displayName: name }).catch(() => {});
        currentProfile = { ...profile, ...patch };
        wrap.remove();
        resolve(currentProfile);
      } catch (err) {
        q('#pf-err').textContent = authErrorText(err);
        q('#pf-save').disabled = false;
      }
    };
  });
}

// ---------- Role Guard ----------
auth.onAuthStateChanged(async (user) => {
  if (authBusy) return;
  if (!user) { if (!IS_AUTH_PAGE) location.replace('auth.html'); return; }

  let profile;
  try { profile = await ensureProfile(user); }
  catch (e) {
    console.error(e);
    showPage();
    alert('เชื่อมต่อฐานข้อมูลไม่ได้: ' + authErrorText(e) + '\n(ตรวจสอบว่าสร้าง Firestore Database และตั้ง Rules แล้ว)');
    return;
  }
  if (IS_AUTH_PAGE) return goByRole(profile);
  if (IS_ADMIN_PAGE && profile.role !== 'admin') {
    alert('คุณไม่มีสิทธิ์เข้าถึงหน้า Admin');
    location.replace('index.html');
    return;
  }
  if (!profile.nameSet) profile = await askProfileName(user, profile, true);   // เข้าครั้งแรก: ให้ตั้งชื่อก่อน
  currentUser = user; currentProfile = profile;
  showPage();
  _resolveAuth({ user, profile });
});

</script>

<script>
const STATUS = {
  Ready: { label: 'พร้อมขาย', cls: 'st-ready' },
  Reserved: { label: 'มีผู้จองแล้ว', cls: 'st-reserved' },
  'Pending Payment': { label: 'รอชำระเงิน', cls: 'st-pending' },
  Shipping: { label: 'กำลังจัดส่ง', cls: 'st-shipping' },
  Sold: { label: 'ขายแล้ว', cls: 'st-sold' },
  Cancelled: { label: 'คำสั่งซื้อยกเลิก', cls: 'st-cancelled' }
};

const FLOW = {
  Ready: ['Reserved', 'Cancelled'],
  Reserved: ['Pending Payment', 'Ready', 'Cancelled'],
  'Pending Payment': ['Shipping', 'Cancelled'],
  Shipping: ['Sold', 'Cancelled'],
  Sold: [],
  Cancelled: ['Ready']
};

const BTN = {
  Ready: 'btn-outline-success', Reserved: 'btn-outline-warning',
  'Pending Payment': 'btn-outline-primary', Shipping: 'btn-outline-info',
  Sold: 'btn-outline-secondary', Cancelled: 'btn-outline-danger'
};

let sellerId = '';   // = uid ของผู้ใช้ที่ล็อกอิน (ตั้งค่าหลัง authReady)
let products = [], orders = [];
let unsubProducts = null, unsubOrders = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPrice = n => Number(n || 0).toLocaleString('th-TH') + ' บาท';
const badge = st => `<span class="badge-status ${(STATUS[st]||{}).cls || 'st-sold'}">${esc((STATUS[st]||{}).label || st)}</span>`;

function toast(msg) { $('toastMsg').textContent = msg; bootstrap.Toast.getOrCreateInstance($('toast'), { delay: 2500 }).show(); }
function showError(e) {
  console.error(e);
  $('alertBox').innerHTML = `<div class="alert alert-danger alert-dismissible">เกิดข้อผิดพลาด: ${esc(e.message || e)}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
}

function subscribe() {
  if (unsubProducts) unsubProducts();
  if (unsubOrders) unsubOrders();
  if (!sellerId) return;

  unsubProducts = db.collection('products').where('sellerId', '==', sellerId)
    .onSnapshot(snap => {
      products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderProducts();
    }, showError);

  unsubOrders = db.collection('orders').where('sellerId', '==', sellerId)
    .onSnapshot(snap => {
      orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderOrders();
    }, showError);
}

const ts = x => (x && x.toMillis ? x.toMillis() : 0);

function renderProducts() {
  const list = [...products].sort((a, b) => ts(b.createdAt) - ts(a.createdAt));
  $('cntProducts').textContent = list.length;
  $('cntReady').textContent = list.filter(p => p.status === 'Ready').length;
  $('cntSold').textContent = list.filter(p => p.status === 'Sold').length;

  if (!list.length) {
    $('productList').innerHTML = '<div class="empty">ยังไม่มีสินค้าของผู้ขายรหัสนี้</div>';
    return;
  }
  $('productList').innerHTML = list.map(p => {
    const next = FLOW[p.status] || [];
    const btns = next.length
      ? next.map(s => `<button class="btn btn-sm ${BTN[s]}" data-act="status" data-id="${p.id}" data-to="${s}">${esc(STATUS[s].label)}</button>`).join('')
      : '<span class="text-muted small">ปิดการขายแล้ว</span>';
    const img = p.imageUrl
      ? `<img class="thumb" src="${esc(p.imageUrl)}" alt="" loading="lazy">`
      : '<div class="thumb"></div>';
    return `<div class="product-row">${img}
      <div class="product-body">
        <div class="d-flex justify-content-between align-items-start gap-2">
          <div class="product-name">${esc(p.name)}</div>${badge(p.status)}
        </div>
        <div class="text-muted small">${fmtPrice(p.price)}</div>
        <div class="actions">${btns}</div>
      </div></div>`;
  }).join('');
}

function renderOrders() {
  const list = [...orders].sort((a, b) => ts(b.createdAt) - ts(a.createdAt));
  const waiting = list.filter(o => o.status === 'requested');
  $('cntRequests').textContent = waiting.length;

  if (!list.length) {
    $('orderBody').innerHTML = '<tr><td colspan="4" class="empty">ยังไม่มีคำขอซื้อ/จอง</td></tr>';
    return;
  }
  const orderLabel = { requested: ['รอยืนยัน', 'st-reserved'], confirmed: ['ยืนยันแล้ว', 'st-ready'], rejected: ['ปฏิเสธแล้ว', 'st-cancelled'] };
  $('orderBody').innerHTML = list.map(o => {
    const [txt, cls] = orderLabel[o.status] || [o.status, 'st-sold'];
    const actions = o.status === 'requested'
      ? `<div class="d-flex flex-column flex-sm-row gap-1 justify-content-end">
           <button class="btn btn-sm btn-green" data-act="confirm" data-id="${o.id}">ยืนยันคำสั่งซื้อ</button>
           <button class="btn btn-sm btn-outline-danger" data-act="reject" data-id="${o.id}">ปฏิเสธคำสั่งซื้อ</button>
         </div>`
      : '<span class="text-muted small">—</span>';
    return `<tr>
      <td class="fw-medium">${esc(o.productName || o.productId)}</td>
      <td>${esc(o.buyerName || o.buyerId || '-')}</td>
      <td><span class="badge-status ${cls}">${txt}</span></td>
      <td class="text-end">${actions}</td></tr>`;
  }).join('');
}

async function changeProductStatus(id, to) {
  const p = products.find(x => x.id === id);
  if (!p || !(FLOW[p.status] || []).includes(to)) return;
  const now = firebase.firestore.FieldValue.serverTimestamp();
  const batch = db.batch();
  batch.update(db.collection('products').doc(id), { status: to, updatedAt: now });
  if (to === 'Sold') {   // ปิดการขาย → คำสั่งซื้อที่ยืนยันแล้วของสินค้านี้เป็น completed (นับเป็นยอดขายในหน้า Admin)
    orders.filter(o => o.productId === id && o.status === 'confirmed')
      .forEach(o => batch.update(db.collection('orders').doc(o.id), { status: 'completed', updatedAt: now }));
  }
  await batch.commit();
  toast(`เปลี่ยนสถานะเป็น "${STATUS[to].label}" แล้ว`);
}

async function decideOrder(orderId, confirm) {
  const o = orders.find(x => x.id === orderId);
  if (!o) return;
  const now = firebase.firestore.FieldValue.serverTimestamp();
  const batch = db.batch();
  batch.update(db.collection('orders').doc(orderId), { status: confirm ? 'confirmed' : 'rejected', updatedAt: now });
  batch.update(db.collection('products').doc(o.productId), { status: confirm ? 'Pending Payment' : 'Ready', updatedAt: now });
  await batch.commit();
  toast(confirm ? 'ยืนยันคำสั่งซื้อแล้ว รอผู้ซื้อชำระเงิน' : 'ปฏิเสธคำสั่งซื้อแล้ว สินค้ากลับมาพร้อมขาย');
}

document.addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  btn.disabled = true;
  try {
    const { act, id, to } = btn.dataset;
    if (act === 'status') await changeProductStatus(id, to);
    if (act === 'confirm') await decideOrder(id, true);
    if (act === 'reject') await decideOrder(id, false);
  } catch (err) { showError(err); btn.disabled = false; }
});

// 🔍 คลิกรูปสินค้าเพื่อดูแบบเต็ม (คลิกที่ใดก็ได้ / กด Esc / กด ✕ เพื่อปิด)
function openLightbox(src) {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out';
  const img = document.createElement('img');
  img.src = src;
  img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)';
  const x = document.createElement('button');
  x.textContent = '✕';
  x.setAttribute('aria-label', 'ปิด');
  x.style.cssText = 'position:absolute;top:14px;right:18px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:20px;cursor:pointer';
  ov.append(img, x);
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  ov.onclick = close;
  document.addEventListener('keydown', onKey);
  document.body.appendChild(ov);
}
document.addEventListener('click', (e) => {
  const im = e.target.closest('img.p-img, img.thumb');
  if (im) openLightbox(im.src);
});

authReady.then(({ user, profile }) => {
  sellerId = user.uid;
  $('whoami').textContent = profile.displayName || user.email;
  subscribe();
});
</script>
