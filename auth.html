<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ / สมัครสมาชิก - Faculty Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
        }

        .auth-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .auth-header h2 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #ccc;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .form-group select option { color: #000; }

        .form-group input:focus, .form-group select:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #181920;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #252733;
        }

        .divider {
            margin: 20px 0;
            display: flex;
            align-items: center;
            text-align: center;
            color: #888;
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 10px;
        }

        .btn-google {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-google img {
            width: 18px;
            height: 18px;
        }

        .auth-footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .auth-footer a {
            color: #6c5ce7;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h2 id="formTitle">🔑 เข้าสู่ระบบ</h2>
        </div>

        <form id="loginForm">
            <div id="regFields" style="display:none">
                <div class="form-group">
                    <label for="fullName">ชื่อ-นามสกุล</label>
                    <input type="text" id="fullName" placeholder="สมชาย ใจดี">
                </div>
                <div class="form-group">
                    <label for="year">ชั้นปี</label>
                    <select id="year">
                        <option value="1">ปี 1</option><option value="2">ปี 2</option>
                        <option value="3">ปี 3</option><option value="4">ปี 4</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="email">อีเมล หรือ รหัสประจำตัว 3 ตัวท้าย</label>
                <input type="text" id="email" placeholder="example@gmail.com หรือ 001" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="current-password" minlength="6" required>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">เข้าสู่ระบบ</button>
        </form>

        <div class="divider">
            <span>หรือ</span>
        </div>

        <button type="button" class="btn-google" id="googleBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            เข้าสู่ระบบด้วย Google
        </button>

        <div class="auth-footer">
            <span id="toggleText">ยังไม่มีบัญชีใช่ไหม?</span> <a href="#" id="toggleLink">สมัครสมาชิกนักศึกษา</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>

    <script>
        const $ = id => document.getElementById(id);
        let isRegister = false;

        // สลับโหมด เข้าสู่ระบบ / สมัครสมาชิก
        $('toggleLink').addEventListener('click', (e) => {
            e.preventDefault();
            isRegister = !isRegister;
            $('regFields').style.display = isRegister ? 'block' : 'none';
            $('fullName').required = isRegister;
            $('formTitle').textContent = isRegister ? '📝 สมัครสมาชิกนักศึกษา' : '🔑 เข้าสู่ระบบ';
            $('submitBtn').textContent = isRegister ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
            $('toggleText').textContent = isRegister ? 'มีบัญชีอยู่แล้ว?' : 'ยังไม่มีบัญชีใช่ไหม?';
            $('toggleLink').textContent = isRegister ? 'เข้าสู่ระบบ' : 'สมัครสมาชิกนักศึกษา';
        });

        // ฟังก์ชัน loginUser / registerUser / googleLogin อยู่ใน js/app.js (สำเร็จแล้วจะพาไปหน้า user/admin ตามสิทธิ์เอง)
        $('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = $('submitBtn');
            btn.disabled = true;
            try {
                if (isRegister) await registerUser($('email').value, $('password').value, $('fullName').value.trim(), parseInt($('year').value, 10));
                else await loginUser($('email').value, $('password').value);
            } catch (err) { console.error(err); alert(authErrorText(err)); btn.disabled = false; }
        });

        $('googleBtn').addEventListener('click', async () => {
            try { await googleLogin(); }
            catch (err) { console.error(err); alert(authErrorText(err)); }
        });
    </script>
</body>
</html>
